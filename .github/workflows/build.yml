name: Build GeDoSaTo DX10-11-12
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Compile DLL and Launcher
        run: |
          New-Item -ItemType Directory -Force -Path src | Out-Null
          Set-Content -Path src/dxgi.def -Encoding ASCII -Value "LIBRARY dxgi`r`nEXPORTS`r`nCreateDXGIFactory=CreateDXGIFactory`r`nCreateDXGIFactory1=CreateDXGIFactory1`r`nCreateDXGIFactory2=CreateDXGIFactory2`r`nDXGIDeclareAdapterRemovalSupport=C:\Windows\System32\dxgi.DXGIDeclareAdapterRemovalSupport`r`nDXGIGetDebugInterface1=C:\Windows\System32\dxgi.DXGIGetDebugInterface1`r`nDXGID3D10CreateDevice=C:\Windows\System32\dxgi.DXGID3D10CreateDevice`r`nDXGID3D10CreateLayeredDevice=C:\Windows\System32\dxgi.DXGID3D10CreateLayeredDevice`r`nDXGID3D10GetLayeredDeviceSize=C:\Windows\System32\dxgi.DXGID3D10GetLayeredDeviceSize`r`nDXGID3D10RegisterLayers=C:\Windows\System32\dxgi.DXGID3D10RegisterLayers`r`nDXGIDumpJournal=C:\Windows\System32\dxgi.DXGIDumpJournal`r`nDXGIReportAdapterConfiguration=C:\Windows\System32\dxgi.DXGIReportAdapterConfiguration`r`nPIXBeginCapture=C:\Windows\System32\dxgi.PIXBeginCapture`r`nPIXEndCapture=C:\Windows\System32\dxgi.PIXEndCapture`r`nPIXGetCaptureState=C:\Windows\System32\dxgi.PIXGetCaptureState"
          Set-Content -Path src/launcher.cpp -Encoding ASCII -Value "#include <windows.h>`r`n#include <tlhelp32.h>`r`n#include <cstdio>`r`n#include <string>`r`n#include <fstream>`r`n#include <set>`r`nDWORD FindPID(const std::string& exe){DWORD p=0;HANDLE s=CreateToolhelp32Snapshot(TH32CS_SNAPPROCESS,0);if(s!=INVALID_HANDLE_VALUE){PROCESSENTRY32 pe;pe.dwSize=sizeof(pe);if(Process32First(s,&pe)){do{if(_stricmp(pe.szExeFile,exe.c_str())==0){p=pe.th32ProcessID;break;}}while(Process32Next(s,&pe));}CloseHandle(s);}return p;}`r`nbool Inj(DWORD pid,const std::string& dll){HANDLE h=OpenProcess(PROCESS_ALL_ACCESS,FALSE,pid);if(!h)return false;void* m=VirtualAllocEx(h,0,dll.size()+1,MEM_COMMIT|MEM_RESERVE,PAGE_READWRITE);if(!m){CloseHandle(h);return false;}WriteProcessMemory(h,m,dll.c_str(),dll.size()+1,0);HANDLE t=CreateRemoteThread(h,0,0,(LPTHREAD_START_ROUTINE)GetProcAddress(GetModuleHandleA(`"kernel32.dll`"),`"LoadLibraryA`"),m,0,0);if(t){WaitForSingleObject(t,5000);CloseHandle(t);}VirtualFreeEx(h,m,0,MEM_RELEASE);CloseHandle(h);return t!=0;}`r`nint main(){SetConsoleTitleA(`"GeDoSaTo 0.22.2320 (DX10-11-12) Injector`");char sp[MAX_PATH];GetModuleFileNameA(0,sp,MAX_PATH);std::string d(sp);size_t pos=d.find_last_of(`"\\/`");if(pos!=std::string::npos)d=d.substr(0,pos+1);std::string dll=d+`"dxgi.dll`",wl=d+`"whitelist.txt`";if(GetFileAttributesA(wl.c_str())==INVALID_FILE_ATTRIBUTES){std::ofstream f(wl.c_str());f<<`"RDR2.exe\nGTA5.exe\nwitcher3.exe\n`";f.close();}printf(`"GeDoSaTo 0.22.2320 Injector Running...\nWaiting for game...\n`");std::set<DWORD> done;while(true){std::ifstream f(wl.c_str());std::string l;while(std::getline(f,l)){size_t a=l.find_first_not_of(`" \t\r\n`");if(a==std::string::npos||l[a]==35)continue;std::string ex=l.substr(a,l.find_last_not_of(`" \t\r\n`")-a+1);DWORD pid=FindPID(ex);if(pid&&done.find(pid)==done.end()){printf(`"[+] Found %s (PID %lu), injecting in 4s...\n`",ex.c_str(),pid);Sleep(4000);printf(Inj(pid,dll)?`"[OK] Injected!\n`":`"[ERR] Run as Admin!\n`");done.insert(pid);}}Sleep(1500);}return 0;}"
          cl /LD /O2 /EHsc src/dxgi_proxy.cpp /link /DEF:src/dxgi.def user32.lib d3d11.lib d3d12.lib dxgi.lib /OUT:dxgi.dll
          cl /O2 /EHsc src/launcher.cpp /link user32.lib /OUT:GeDoSaToLauncher.exe
      - name: Upload Package
        uses: actions/upload-artifact@v4
        with:
          name: GeDoSaTo-DX10-11-12-Full
          path: |
            dxgi.dll
            GeDoSaToLauncher.exe
