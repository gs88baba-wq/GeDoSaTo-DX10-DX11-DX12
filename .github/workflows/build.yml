name: Build GeDoSaTo DX10-11-12
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Compile DLL and Launcher
        run: |
          @"
          LIBRARY dxgi
          EXPORTS
              CreateDXGIFactory=CreateDXGIFactory
              CreateDXGIFactory1=CreateDXGIFactory1
              CreateDXGIFactory2=CreateDXGIFactory2
              DXGIDeclareAdapterRemovalSupport=C:\Windows\System32\dxgi.DXGIDeclareAdapterRemovalSupport
              DXGIGetDebugInterface1=C:\Windows\System32\dxgi.DXGIGetDebugInterface1
              DXGID3D10CreateDevice=C:\Windows\System32\dxgi.DXGID3D10CreateDevice
              DXGID3D10CreateLayeredDevice=C:\Windows\System32\dxgi.DXGID3D10CreateLayeredDevice
              DXGID3D10GetLayeredDeviceSize=C:\Windows\System32\dxgi.DXGID3D10GetLayeredDeviceSize
              DXGID3D10RegisterLayers=C:\Windows\System32\dxgi.DXGID3D10RegisterLayers
              DXGIDumpJournal=C:\Windows\System32\dxgi.DXGIDumpJournal
              DXGIReportAdapterConfiguration=C:\Windows\System32\dxgi.DXGIReportAdapterConfiguration
              PIXBeginCapture=C:\Windows\System32\dxgi.PIXBeginCapture
              PIXEndCapture=C:\Windows\System32\dxgi.PIXEndCapture
              PIXGetCaptureState=C:\Windows\System32\dxgi.PIXGetCaptureState
          "@ | Out-File -FilePath src/dxgi.def -Encoding ascii
          cl /LD /O2 /EHsc src/dxgi_proxy.cpp /link /DEF:src/dxgi.def user32.lib d3d11.lib d3d12.lib dxgi.lib /OUT:dxgi.dll
          cl /O2 /EHsc src/launcher.cpp /link user32.lib /OUT:GeDoSaToLauncher.exe
      - name: Upload Package
        uses: actions/upload-artifact@v4
        with:
          name: GeDoSaTo-DX10-11-12-Full
          path: |
            dxgi.dll
            GeDoSaToLauncher.exe
